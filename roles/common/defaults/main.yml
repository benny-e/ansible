---
admin_user: admin
admin_shell: /bin/bash
admin_ssh_public_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"
admin_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
admin_ssh_address: "{{ ansible_host | default(inventory_hostname) }}"
admin_ssh_port: "{{ ansible_port | default(22) }}"

admin_ssh_command:
  - ssh
  - -o
  - BatchMode=yes
  - -o
  - PasswordAuthentication=no
  - -o
  - KbdInteractiveAuthentication=no
  - -o
  - PreferredAuthentications=publickey
  - -o
  - IdentitiesOnly=yes
  - -o
  - ConnectTimeout=10
  - -o
  - StrictHostKeyChecking=accept-new
  - -i
  - "{{ admin_ssh_private_key_file }}"
  - -p
  - "{{ admin_ssh_port | string }}"

common_packages:
  - sudo
  - vim
  - git
  - curl
  - wget
  - htop
  - tmux
  - jq
  - rsync
  - unzip
  - ca-certificates

common_install_fastfetch: true

---
- name: Harden new Debian or Ubuntu server
  hosts: all
  become: true
  gather_facts: true

  vars_prompt:
    - name: admin_user
      prompt: "Admin username"
      default: admin
      private: false

  vars:
    admin_shell: /bin/bash

    # Keys on the Ansible control machine
    admin_public_key_file: "{{ lookup('env', 'HOME') + '/.ssh/id_ed25519.pub' }}"
    admin_private_key_file: "{{ lookup('env', 'HOME') + '/.ssh/id_ed25519' }}"

    ssh_port: 22

    baseline_packages:
      - sudo
      - vim
      - git
      - curl
      - wget
      - htop
      - tmux
      - jq
      - rsync
      - unzip
      - ca-certificates
      - ufw
      - fail2ban
      - unattended-upgrades
      - needrestart
      - fastfetch

  pre_tasks:
    - name: Refuse to run on non-Debian systems
      ansible.builtin.assert:
        that:
          - ansible_facts["os_family"] == "Debian"
        fail_msg: "This playbook currently supports Debian/Ubuntu systems only."

    - name: Verify controller public key exists
      ansible.builtin.stat:
        path: "{{ admin_public_key_file }}"
      delegate_to: localhost
      become: false
      register: controller_public_key

    - name: Verify controller private key exists
      ansible.builtin.stat:
        path: "{{ admin_private_key_file }}"
      delegate_to: localhost
      become: false
      register: controller_private_key

    - name: Refuse to continue without SSH keypair
      ansible.builtin.assert:
        that:
          - controller_public_key.stat.exists
          - controller_private_key.stat.exists
        fail_msg: >-
          Expected SSH keypair at
          {{ admin_private_key_file }} and
          {{ admin_public_key_file }}.

  tasks:
    # -------------------------------------------------------------------------
    # Updates / packages
    # -------------------------------------------------------------------------

    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: safe

    - name: Install baseline packages
      ansible.builtin.apt:
        name: "{{ baseline_packages }}"
        state: present

    # -------------------------------------------------------------------------
    # Admin account
    # -------------------------------------------------------------------------

    - name: Create admin user
      ansible.builtin.user:
        name: "{{ admin_user }}"
        shell: "{{ admin_shell }}"
        create_home: true
        groups:
          - sudo
        append: true
        state: present

    # A newly-created Debian account can have a locked password field ("!").
    # sshd can reject public-key authentication for a locked account.
    #
    # "NP" is deliberately NOT a usable password hash. It prevents the account
    # from being treated as locked while still providing no usable password.
    #
    # Later in this playbook SSH password authentication is disabled entirely.

    - name: Check admin account password state
      ansible.builtin.command:
        argv:
          - /usr/bin/passwd
          - -S
          - "{{ admin_user }}"
      register: admin_password_state
      changed_when: false

    - name: Make locked admin account usable for key authentication
      ansible.builtin.command:
        argv:
          - /usr/sbin/usermod
          - -p
          - NP
          - "{{ admin_user }}"
      when:
        - admin_password_state.stdout.split() | length >= 2
        - admin_password_state.stdout.split()[1] == "L"

    - name: Recheck admin account password state
      ansible.builtin.command:
        argv:
          - /usr/bin/passwd
          - -S
          - "{{ admin_user }}"
      register: admin_password_state_after
      changed_when: false

    - name: Refuse to continue if admin account is still locked
      ansible.builtin.assert:
        that:
          - admin_password_state_after.stdout.split() | length >= 2
          - admin_password_state_after.stdout.split()[1] != "L"
        fail_msg: >-
          The {{ admin_user }} account is still locked.
          Refusing to change SSH configuration.

    - name: Create admin SSH directory
      ansible.builtin.file:
        path: "/home/{{ admin_user }}/.ssh"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0700"

    - name: Install admin SSH public key
      ansible.builtin.lineinfile:
        path: "/home/{{ admin_user }}/.ssh/authorized_keys"
        line: "{{ lookup('file', admin_public_key_file) }}"
        create: true
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0600"
        state: present

    - name: Ensure admin home ownership is correct
      ansible.builtin.file:
        path: "/home/{{ admin_user }}"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"

    - name: Configure passwordless sudo for admin
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"

    # -------------------------------------------------------------------------
    # Bootstrap SSH configuration
    #
    # DO NOT disable password authentication yet.
    #
    # We first explicitly configure sshd to accept the key from the normal
    # authorized_keys location, reload it, and prove the new account works.
    # -------------------------------------------------------------------------

    - name: Ensure SSH configuration directory exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install temporary SSH bootstrap configuration
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible
          # Bootstrap configuration - hardening occurs after key verification.

          PubkeyAuthentication yes
          AuthorizedKeysFile .ssh/authorized_keys
          AuthenticationMethods any
          PermitEmptyPasswords no
      register: ssh_bootstrap_config

    - name: Validate bootstrap SSH configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false

    # ssh.service may be inactive when Debian/Ubuntu uses ssh.socket.
    # If the service is already running, reload it.
    # If socket activation is being used, new sshd processes will read the
    # updated configuration on the next connection.

    - name: Check whether SSH service is active
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - ssh.service
      register: ssh_service_active
      changed_when: false
      failed_when: false

    - name: Reload SSH bootstrap configuration
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
      when:
        - ssh_bootstrap_config.changed
        - ssh_service_active.rc == 0

    # -------------------------------------------------------------------------
    # CRITICAL SAFETY CHECK
    #
    # This test allows PUBLIC KEY AUTHENTICATION ONLY.
    #
    # If this fails, the playbook stops here. Password authentication and the
    # original bootstrap account remain untouched.
    # -------------------------------------------------------------------------

    - name: Verify admin SSH key works
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - IdentitiesOnly=yes
          - -o
          - PreferredAuthentications=publickey
          - -o
          - PasswordAuthentication=no
          - -o
          - KbdInteractiveAuthentication=no
          - -o
          - ConnectTimeout=10
          - -o
          - StrictHostKeyChecking=accept-new
          - -p
          - "{{ ssh_port | string }}"
          - -i
          - "{{ admin_private_key_file }}"
          - "{{ admin_user }}@{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
          - "true"
      delegate_to: localhost
      become: false
      changed_when: false

    # -------------------------------------------------------------------------
    # UFW
    # -------------------------------------------------------------------------

    - name: Set UFW default incoming policy
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set UFW default outgoing policy
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow SSH through UFW
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp
        comment: SSH

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        logging: low

    # -------------------------------------------------------------------------
    # Fail2ban
    # -------------------------------------------------------------------------

    - name: Configure Fail2ban SSH protection
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        owner: root
        group: root
        mode: "0644"
        content: |
          [sshd]
          enabled = true
          port = {{ ssh_port }}
          maxretry = 5
          findtime = 10m
          bantime = 1h
      notify: Restart Fail2ban

    - name: Enable and start Fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban
        enabled: true
        state: started

    # -------------------------------------------------------------------------
    # Automatic security updates
    # -------------------------------------------------------------------------

    - name: Enable automatic package list updates and unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    # -------------------------------------------------------------------------
    # Final SSH hardening
    #
    # We only reach this point after PUBLIC KEY AUTHENTICATION HAS SUCCEEDED.
    # -------------------------------------------------------------------------

    - name: Install final SSH hardening configuration
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible

          Port {{ ssh_port }}

          PermitRootLogin no

          PubkeyAuthentication yes
          AuthorizedKeysFile .ssh/authorized_keys
          AuthenticationMethods publickey

          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitEmptyPasswords no

          X11Forwarding no

          MaxAuthTries 3
          LoginGraceTime 30
      register: ssh_hardening

    - name: Validate final SSH configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false

    # Ubuntu/Debian can use ssh.socket. We deliberately switch to the normal
    # ssh.service so sshd itself owns the listener and the Port directive is
    # consistently controlled by sshd_config.

    - name: Check whether ssh.socket exists
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - cat
          - ssh.socket
      register: ssh_socket_unit
      changed_when: false
      failed_when: false

    - name: Disable SSH socket activation
      ansible.builtin.systemd_service:
        name: ssh.socket
        state: stopped
        enabled: false
      when: ssh_socket_unit.rc == 0

    - name: Ensure SSH runtime directory exists
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure SSH service is enabled and running
      ansible.builtin.systemd_service:
        name: ssh
        state: started
        enabled: true

    - name: Reload SSH with hardened configuration
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
      when: ssh_hardening.changed

    # -------------------------------------------------------------------------
    # Final verification
    # -------------------------------------------------------------------------

    - name: Verify hardened SSH login works
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - IdentitiesOnly=yes
          - -o
          - PreferredAuthentications=publickey
          - -o
          - PasswordAuthentication=no
          - -o
          - KbdInteractiveAuthentication=no
          - -o
          - ConnectTimeout=10
          - -o
          - StrictHostKeyChecking=accept-new
          - -p
          - "{{ ssh_port | string }}"
          - -i
          - "{{ admin_private_key_file }}"
          - "{{ admin_user }}@{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
          - "true"
      delegate_to: localhost
      become: false
      changed_when: false

  handlers:
    - name: Restart Fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban
        state: restarted
